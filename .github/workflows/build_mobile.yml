name: DutyDesk Mobile Build (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile-client/dutydesk_mobile
          flutter pub get

      - name: Build Android APK
        run: |
          cd mobile-client/dutydesk_mobile
          flutter build apk --release --no-shrink

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DutyDesk-Android-Release-APK
          path: mobile-client/dutydesk_mobile/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile-client/dutydesk_mobile
          flutter pub get

      - name: Build iOS Application (No Codesign for Ad-Hoc / Sideloading)
        run: |
          cd mobile-client/dutydesk_mobile
          flutter build ios --release --no-codesign

      - name: Package .IPA for Sideloading / AltStore / TrollStore
        run: |
          cd mobile-client/dutydesk_mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r DutyDesk-iOS.ipa Payload
          echo "Created DutyDesk-iOS.ipa"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: DutyDesk-iOS-Release-IPA
          path: mobile-client/dutydesk_mobile/build/ios/iphoneos/DutyDesk-iOS.ipa
